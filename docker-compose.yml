version: "3.9"

services:

  backend:

    build:
      context: .
      dockerfile: backend/Dockerfile

    volumes:
      - .:/app

    ports:
      - "8080:8080"

    env_file:
      - .env

    command: >
      sh -c "echo 'Django corriendo en Docker (contenedor backend)' &&
      echo 'Aplicacion: http://localhost:8080' &&
      echo 'PostgreSQL (servicio): $$DB_HOST:$$DB_PORT' &&
      python manage.py runserver 0.0.0.0:8080"

    depends_on:
      - postgres

    networks:
      - backend_network

  postgres:

    image: postgres:15-alpine
    container_name: postgres_db
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend_network

volumes:
  postgres_data:

networks:
  backend_network:
